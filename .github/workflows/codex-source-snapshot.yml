name: codex source snapshot

on:
  push:
    branches:
      - codex/webmcp-submission-readiness
    paths:
      - .github/workflows/codex-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out readiness branch
        uses: actions/checkout@v4
        with:
          path: readiness

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Package both source trees
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/readiness-source.tar.gz -C readiness .
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/main-source.tar.gz -C main .
          mv /tmp/readiness-source.tar.gz .
          mv /tmp/main-source.tar.gz .

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codex-final-repair-source-${{ github.sha }}
          path: |
            readiness-source.tar.gz
            main-source.tar.gz
          if-no-files-found: error
          retention-days: 1

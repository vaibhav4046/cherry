name: codex source reconciliation snapshot

on:
  push:
    branches:
      - codex/webmcp-submission-readiness
    paths:
      - .github/workflows/codex-unit-diagnostic.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out readiness branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: readiness

      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Check out merge base
        uses: actions/checkout@v4
        with:
          ref: dc6ac56eeaf7a15bf037023430c5f53aad27525b
          path: base

      - name: Package source trees
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf readiness-source.tar.gz -C readiness .
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf main-source.tar.gz -C main .
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf base-source.tar.gz -C base .

      - name: Upload reconciliation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codex-reconciliation-${{ github.sha }}
          path: |
            readiness-source.tar.gz
            main-source.tar.gz
            base-source.tar.gz
          if-no-files-found: error
          retention-days: 1

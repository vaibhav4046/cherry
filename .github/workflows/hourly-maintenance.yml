# Read-only monitoring is always active. Repair is optional, bounded, and can
# only produce a pull request; this workflow never merges or deploys.
name: Hourly Cherry maintenance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherry-hourly-maintenance
  cancel-in-progress: false

env:
  CHERRY_BASE_URL: https://cherry-wine.vercel.app

jobs:
  monitor:
    name: Repository, WebMCP and live-app monitor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Deterministic gates
        run: npm run gates

      - name: Production build
        run: npm run build

      - name: Release-pack integrity
        run: npm run verify:pack

      - name: Service-worker integrity
        run: npm run verify:sw

      - name: Submission and active-policy audit
        run: npm run audit:submission

      - name: Critical registered-closure journeys
        run: npm run test:e2e:critical

      - name: Public-route health
        if: always()
        run: npm run health:hourly

      - name: Write run summary
        if: always()
        run: |
          {
            echo '## Hourly Cherry maintenance'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Live base: ${CHERRY_BASE_URL}"
            echo "- Result: see the job conclusion and uploaded evidence"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-maintenance-${{ github.run_id }}
          path: |
            artifacts/hourly/
            artifacts/release/
            docs/release/e2e-results.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  report-failure:
    name: Open or update the maintenance incident
    needs: monitor
    if: ${{ always() && needs.monitor.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Record one deduplicated incident
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[hourly] Cherry maintenance failure';
            const marker = '<!-- cherry-hourly-maintenance-incident -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find((item) => !item.pull_request && item.title === title);
            const note = [
              `Hourly maintenance failed on \`${context.sha}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              'The run contains deterministic logs, browser traces, and any route-health JSON that was produced.',
            ].join('\n');
            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: note,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${marker}\n\n${note}\n\nThis issue is closed automatically after a fully healthy hourly run.`,
              });
            }

  close-recovered-incident:
    name: Close the incident after recovery
    needs: monitor
    if: ${{ always() && needs.monitor.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open hourly incident
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[hourly] Cherry maintenance failure';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find((item) => !item.pull_request && item.title === title);
            if (!incident) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: incident.number,
              body: `Recovered on \`${context.sha}\`. Healthy run: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: incident.number,
              state: 'closed',
              state_reason: 'completed',
            });

  codex-propose:
    name: Ask Codex for a bounded patch
    needs: monitor
    if: ${{ always() && needs.monitor.result == 'failure' && vars.CODEX_HOURLY_REPAIR != 'disabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      proposal: ${{ steps.run-codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the exact repair base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check whether Codex credentials are configured
        id: codex-key
        shell: bash
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$HAS_OPENAI_API_KEY" == 'true' ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Codex repair skipped: OPENAI_API_KEY is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.codex-key.outputs.available == 'true' }}
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile before Codex loses network access
        if: ${{ steps.codex-key.outputs.available == 'true' }}
        run: npm ci

      - name: Install pinned Chromium before Codex loses network access
        if: ${{ steps.codex-key.outputs.available == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Remove the repository remote from the agent workspace
        if: ${{ steps.codex-key.outputs.available == 'true' }}
        run: git remote remove origin

      # Keep this as the last step in this job. No credentialed or trusted
      # command runs on a host after Codex has been able to mutate it.
      - name: Ask Codex for the smallest repair proposal
        if: ${{ steps.codex-key.outputs.available == 'true' }}
        id: run-codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/hourly-repair.md
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: true
          codex-args: '["--ephemeral"]'
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "status": { "type": "string", "enum": ["repair", "no_change"] },
                "summary": { "type": "string", "maxLength": 2000 },
                "patch": { "type": "string", "maxLength": 200000 }
              },
              "required": ["status", "summary", "patch"]
            }

  repair-verify:
    name: Verify the Codex patch without write credentials
    needs: [monitor, codex-propose]
    if: ${{ always() && needs.codex-propose.result == 'success' && needs.codex-propose.outputs.proposal != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      status: ${{ steps.proposal.outputs.status }}
      verified: ${{ steps.attest.outputs.verified }}
      patch_sha256: ${{ steps.proposal.outputs.patch_sha256 }}
      staged_diff_sha256: ${{ steps.proposal.outputs.staged_diff_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.codex-propose.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate and apply the proposed textual patch
        id: proposal
        env:
          CODEX_PROPOSAL_JSON: ${{ needs.codex-propose.outputs.proposal }}
        run: node scripts/apply-codex-proposal.mjs apply

      - name: Install from the unchanged lockfile
        if: ${{ steps.proposal.outputs.status == 'repair' }}
        run: npm ci

      - name: Install pinned Chromium
        if: ${{ steps.proposal.outputs.status == 'repair' }}
        run: npx playwright install --with-deps chromium

      - name: Verify the proposed repair
        if: ${{ steps.proposal.outputs.status == 'repair' }}
        run: npm run verify:repair

      - name: Upload isolated verification evidence
        if: ${{ always() && steps.proposal.outputs.status == 'repair' }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/
            docs/release/e2e-results.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove known transient verification output
        if: ${{ steps.proposal.outputs.status == 'repair' }}
        shell: bash
        run: |
          git restore --worktree docs/release/e2e-results.json 2>/dev/null || true
          rm -rf artifacts/hourly artifacts/release test-results playwright-report

      - name: Attest that verification did not alter the proposal
        if: ${{ steps.proposal.outputs.status == 'repair' }}
        id: attest
        env:
          EXPECTED_STAGED_DIFF_SHA256: ${{ steps.proposal.outputs.staged_diff_sha256 }}
        run: node scripts/apply-codex-proposal.mjs attest

  repair-publish:
    name: Publish the already-verified repair pull request
    needs: [codex-propose, repair-verify]
    if: ${{ always() && needs.repair-verify.outputs.verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BRANCH_NAME: codex/hourly-repair-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.codex-propose.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create the isolated repair branch
        run: git switch -c "$BRANCH_NAME"

      - name: Reapply the exact verified patch
        env:
          CODEX_PROPOSAL_JSON: ${{ needs.codex-propose.outputs.proposal }}
          EXPECTED_PATCH_SHA256: ${{ needs.repair-verify.outputs.patch_sha256 }}
          EXPECTED_STAGED_DIFF_SHA256: ${{ needs.repair-verify.outputs.staged_diff_sha256 }}
        run: node scripts/apply-codex-proposal.mjs apply

      - name: Commit without running repository hooks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git commit -m 'fix: apply verified hourly Codex repair'

      - name: Push and open the human-reviewed pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"
          {
            echo '## Automated repair'
            echo
            echo "Codex proposed this bounded repair after hourly maintenance failed on \`${GITHUB_SHA}\`."
            echo
            echo "- Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Base commit: \`${{ needs.codex-propose.outputs.base_sha }}\`"
            echo "- Patch SHA-256: \`${{ needs.repair-verify.outputs.patch_sha256 }}\`"
            echo '- Verification: isolated job, `npm run verify:repair`'
            echo '- Merge: human review required'
            echo '- Deploy: not performed'
            echo
            echo 'This workflow never auto-merges or deploys.'
          } > /tmp/cherry-hourly-pr.md
          gh pr create \
            --base '${{ github.event.repository.default_branch }}' \
            --head "$BRANCH_NAME" \
            --title 'fix: verified hourly Codex repair' \
            --body-file /tmp/cherry-hourly-pr.md
          gh workflow run verify.yml --ref "$BRANCH_NAME"

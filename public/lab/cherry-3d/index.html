<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cherry Wine — 3D Brand Artifacts</title>
<script type="importmap">
{
  "imports": {
    "three": "/lab/cherry-3d/vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "/lab/cherry-3d/vendor/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "/lab/cherry-3d/vendor/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "/lab/cherry-3d/vendor/GLTFExporter.js"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe3ec; }
  three-d-stage:not(:defined) { visibility: hidden; }
  a { color: #5c0a1e; } a:hover { color: #a81635; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px; pointer-events: none; z-index: 10; gap: 16px; flex-wrap: wrap; }
  .mark { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px; line-height: 1; color: #5c0a1e; }
  .sub { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.24em; color: #b05a75; margin-top: 6px; }
  .picker { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
  .picker button { font-family: 'DM Mono', monospace; font-size: 12px; padding: 9px 15px; border-radius: 999px; border: 1px solid #ecb3c6; background: #fff8fa; color: #5c0a1e; cursor: pointer; }
  .picker button:hover { border-color: #5c0a1e; }
  .picker button.on { background: #5c0a1e; color: #ffe3ec; border-color: #5c0a1e; }
</style>
</head>
<body>
<three-d-stage name="cherry-twins" background="#ffe3ec" autorotate></three-d-stage>
<div class="hud">
  <div>
    <div class="mark">Cherry Wine</div>
    <div class="sub">3D BRAND ARTIFACTS</div>
    <div class="sub" style="pointer-events:auto"><a href="/">&#8592; BACK TO CHERRY</a></div>
  </div>
  <div class="picker">
    <button data-obj="twins" class="on">Cherry Twins</button>
    <button data-obj="coupe">Coupe &amp; Garnish</button>
    <button data-obj="bottle">The Bottle</button>
  </div>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

function mat(name, opts) { const m = new THREE.MeshStandardMaterial(opts); m.name = name; return m; }
const M = {
  cherry: mat('cherry-lacquer', { color: 0x84112a, roughness: 0.14, metalness: 0.05 }),
  stem:   mat('stem-green',     { color: 0x4a7a33, roughness: 0.55 }),
  leaf:   mat('leaf-green',     { color: 0x5b8f3e, roughness: 0.5, side: THREE.DoubleSide }),
  glass:  mat('blush-glass',    { color: 0xfff0f5, roughness: 0.04, transparent: true, opacity: 0.14, side: THREE.DoubleSide }),
  wine:   mat('cherry-wine',    { color: 0x7a1030, roughness: 0.1 }),
  bottle: mat('bottle-glass',   { color: 0x40101f, roughness: 0.22 }),
  cork:   mat('cork',           { color: 0xd2a86e, roughness: 0.8 }),
  label:  mat('label-cream',    { color: 0xfff3f6, roughness: 0.6, side: THREE.DoubleSide }),
  foil:   mat('blush-foil',     { color: 0xef7fa4, roughness: 0.35, metalness: 0.3 }),
};

const lathe = (pts, segs = 64) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), segs);
function quad(pts, a, b, c, n) { // sample quadratic bezier, skipping start point
  for (let i = 1; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u*u*a[0] + 2*u*t*b[0] + t*t*c[0], u*u*a[1] + 2*u*t*b[1] + t*t*c[1]]);
  }
}
function tube(points, r, material, name) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 36, r, 10), material);
  m.name = name; return m;
}
function cherryMesh(R, name) { // lathe with stem dimple
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const t = i / 30, phi = Math.PI * t;
    let x = Math.sin(phi) * R, y = -Math.cos(phi) * R * 0.94;
    if (t > 0.86) { const k = (t - 0.86) / 0.14; y -= k * k * R * 0.26; }
    pts.push([Math.max(x, 0.0004), y]);
  }
  const m = new THREE.Mesh(lathe(pts, 56), M.cherry);
  m.name = name; return m;
}
function leafMesh(len, wid, name) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(len * 0.4, wid, len, 0);
  s.quadraticCurveTo(len * 0.4, -wid, 0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.0014, bevelEnabled: true, bevelThickness: 0.0006, bevelSize: 0.001, bevelSegments: 2, curveSegments: 16 });
  const m = new THREE.Mesh(g, M.leaf);
  m.name = name; return m;
}

function buildTwins() {
  const g = new THREE.Group(); g.name = 'cherry-twins';
  const L = cherryMesh(0.05, 'cherry-left');
  L.position.set(-0.055, 0.047, 0.004); L.rotation.set(0.06, 0.3, -0.12);
  const R = cherryMesh(0.047, 'cherry-right');
  R.position.set(0.058, 0.0445, -0.006); R.rotation.set(-0.05, -0.4, 0.14);
  const J = [0.006, 0.185, 0];
  const stemL = tube([[-0.06, 0.075, 0.004], [-0.066, 0.124, 0.002], [-0.032, 0.168, 0.001], J], 0.0042, M.stem, 'stem-left');
  const stemR = tube([[0.062, 0.071, -0.006], [0.073, 0.118, -0.004], [0.042, 0.164, -0.002], J], 0.0042, M.stem, 'stem-right');
  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.0062, 20, 16), M.stem);
  knot.name = 'stem-knot'; knot.position.set(...J);
  const tip = tube([J, [0.009, 0.199, 0.001], [0.016, 0.205, 0.003]], 0.0036, M.stem, 'stem-tip');
  const leaf = leafMesh(0.058, 0.019, 'leaf');
  leaf.position.set(0.008, 0.184, -0.001);
  leaf.rotation.set(-0.9, 0.2, -0.55);
  g.add(L, R, stemL, stemR, knot, tip, leaf);
  return g;
}

function buildCoupe() {
  const g = new THREE.Group(); g.name = 'cherry-coupe';
  const pts = [[0.0006, 0], [0.030, 0]];
  quad(pts, [0.030, 0], [0.045, 0.0005], [0.045, 0.004], 4);      // base edge
  quad(pts, [0.045, 0.004], [0.040, 0.007], [0.016, 0.014], 5);   // base dome
  quad(pts, [0.016, 0.014], [0.0058, 0.02], [0.0058, 0.034], 5);  // into stem
  pts.push([0.0058, 0.072]);                                       // stem
  quad(pts, [0.0058, 0.072], [0.007, 0.080], [0.014, 0.0835], 4); // flare
  quad(pts, [0.014, 0.0835], [0.052, 0.087], [0.056, 0.121], 9);  // bowl outer
  quad(pts, [0.056, 0.121], [0.0585, 0.147], [0.049, 0.156], 7);  // to rim
  quad(pts, [0.049, 0.156], [0.0475, 0.1575], [0.0465, 0.1555], 3); // rim roll
  quad(pts, [0.0465, 0.1555], [0.055, 0.146], [0.0532, 0.121], 7);  // inner wall
  quad(pts, [0.0532, 0.121], [0.0495, 0.090], [0.0006, 0.0875], 9); // inner bottom
  const glassM = new THREE.Mesh(lathe(pts, 72), M.glass); glassM.name = 'coupe-glass';
  const w = [[0.0006, 0.0895]];
  quad(w, [0.0006, 0.0895], [0.043, 0.0915], [0.0512, 0.115], 8);
  quad(w, [0.0512, 0.115], [0.0527, 0.128], [0.0526, 0.140], 4);
  w.push([0.0006, 0.140]);
  const wine = new THREE.Mesh(lathe(w, 72), M.wine); wine.name = 'wine';
  const cherry = cherryMesh(0.018, 'cherry-garnish');
  cherry.position.set(0.016, 0.143, 0.005);
  const stem = tube([[0.016, 0.156, 0.005], [0.023, 0.176, 0.001], [0.042, 0.180, -0.004], [0.055, 0.166, -0.008], [0.060, 0.151, -0.010]], 0.0025, M.stem, 'garnish-stem');
  g.add(glassM, wine, cherry, stem);
  return g;
}

function buildBottle() {
  const g = new THREE.Group(); g.name = 'cherry-wine-bottle';
  const p = [[0.0006, 0], [0.028, 0]];
  quad(p, [0.028, 0], [0.038, 0.0005], [0.038, 0.009], 4);        // base chamfer
  p.push([0.038, 0.185]);                                          // body
  quad(p, [0.038, 0.185], [0.038, 0.232], [0.0125, 0.248], 10);   // shoulder
  p.push([0.0125, 0.298]);                                         // neck
  quad(p, [0.0125, 0.298], [0.0148, 0.2985], [0.0148, 0.304], 3); // lip out
  quad(p, [0.0148, 0.304], [0.0148, 0.3085], [0.011, 0.309], 3);  // lip top
  p.push([0.0006, 0.309]);
  const body = new THREE.Mesh(lathe(p, 64), M.bottle); body.name = 'bottle-glass';
  const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.0102, 0.0102, 0.026, 28), M.cork);
  cork.name = 'cork'; cork.position.y = 0.316;
  const foil = new THREE.Mesh(new THREE.CylinderGeometry(0.0152, 0.0152, 0.033, 32), M.foil);
  foil.name = 'foil-capsule'; foil.position.y = 0.2965;
  const label = new THREE.Mesh(new THREE.CylinderGeometry(0.0389, 0.0389, 0.075, 64, 1, true), M.label);
  label.name = 'label'; label.position.y = 0.105;
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(0.0062, 24, 18), M.cherry);
  c1.name = 'label-cherry-left'; c1.position.set(-0.0068, 0.089, 0.0372);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.0056, 24, 18), M.cherry);
  c2.name = 'label-cherry-right'; c2.position.set(0.0078, 0.0865, 0.0372);
  const s1 = tube([[-0.0068, 0.0895, 0.0392], [-0.006, 0.101, 0.0398], [0.0005, 0.111, 0.0399]], 0.0011, M.stem, 'label-stem-left');
  const s2 = tube([[0.0078, 0.090, 0.0392], [0.010, 0.102, 0.0398], [0.0005, 0.111, 0.0399]], 0.0011, M.stem, 'label-stem-right');
  g.add(body, cork, foil, label, c1, c2, s1, s2);
  return g;
}

const objects = {
  twins:  { name: 'cherry-twins',      build: buildTwins },
  coupe:  { name: 'cherry-coupe',      build: buildCoupe },
  bottle: { name: 'cherry-wine-bottle', build: buildBottle },
};
const cache = {};
function show(key) {
  const o = objects[key];
  cache[key] = cache[key] || o.build();
  stage.setAttribute('name', o.name);
  stage.setObject(cache[key]);
  document.querySelectorAll('.picker button').forEach(b => b.classList.toggle('on', b.dataset.obj === key));
}
document.querySelectorAll('.picker button').forEach(b => b.addEventListener('click', () => show(b.dataset.obj)));
show('twins');
</script>
</body>
</html>
